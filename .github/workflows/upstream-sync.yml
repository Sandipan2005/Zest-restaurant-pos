name: Daily upstream sync

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # Keep the source repository here. Change this value if your upstream is a
  # different fork or mirror.
  UPSTREAM_REPOSITORY: Raktim94/nodedr-restaurant-pos

jobs:
  sync:
    # The source repository must never create a self-sync branch. This runs
    # after the project is forked, where origin is the restaurant's fork.
    if: github.repository != 'Raktim94/nodedr-restaurant-pos'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch upstream changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream
          upstream_default="$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          if [[ -z "$upstream_default" ]]; then
            upstream_default="master"
          fi
          echo "UPSTREAM_BRANCH=$upstream_default" >> "$GITHUB_ENV"

      - name: Merge upstream into a review branch
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          sync_branch="automation/upstream-sync-$(date -u +%Y%m%d)"
          echo "SYNC_BRANCH=$sync_branch" >> "$GITHUB_ENV"
          git switch -c "$sync_branch"
          if ! git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            git merge --abort || true
            echo "::error::Upstream changes conflict with restaurant customizations. Resolve the merge manually."
            exit 1
          fi
          if git diff --quiet "origin/${{ github.event.repository.default_branch }}" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: git push --set-upstream origin "$SYNC_BRANCH"

      - name: Open sync pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh pr list --head "$SYNC_BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$SYNC_BRANCH" \
              --title "chore: sync upstream updates" \
              --body "A daily sync found upstream changes. Review conflicts and verify the Zest branding before merging."
          fi
